server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Подсайт лежит под префиксом /po-system/; настоящий 404 со страницей подсайта.
  error_page 404 /po-system/404.html;

  location = /po-system { return 308 /po-system/; }

  location ^~ /po-system/_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ^~ /po-system/ {
    add_header Cache-Control "no-cache";
    # без слэша на конце — 308 на слэш, как у каталогов на хостинге
    try_files $uri $uri/index.html $uri/ =404;
  }

  location = /po-system/404.html { internal; }

  # Корень обслуживает основной сайт; сюда запрос не должен попадать.
  location / { return 404; }
}
